# Nginx Reverse Proxy for go2rtc (KidsWorld Nursery)
# Domain: stream.yourdomain.com
# Placed in: /etc/nginx/sites-available/stream.yourdomain.com
# Linked to: /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name stream.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server with WSS & WebRTC API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.yourdomain.com;

    # SSL certificates issued by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/stream.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 1. WebRTC Signaling API (HTTP POST for SDP offer/answer)
    location /api/webrtc {
        proxy_pass http://127.0.0.1:1984/api/webrtc;
        proxy_http_version 1.1;

        # Allow CORS for Web and Mobile applications
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSocket Signaling (WSS)
    location /api/ws {
        proxy_pass http://127.0.0.1:1984/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. HLS Stream Fallback (for older devices or backup)
    location /api/stream.m3u8 {
        proxy_pass http://127.0.0.1:1984/api/stream.m3u8;
        proxy_http_version 1.1;
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Stream segments (.ts / .mp4 / .m4s)
    location /api/hls/ {
        proxy_pass http://127.0.0.1:1984/api/hls/;
        proxy_http_version 1.1;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # 5. Security: Restrict direct access to go2rtc Admin Dashboard
    # Blocks unauthorized public browsing of camera streams from browser
    location / {
        # Allow internal network or VPN, deny others, or return 403
        # If admin needs access, use basic auth or SSH port-forwarding:
        # ssh -L 1984:127.0.0.1:1984 root@stream.yourdomain.com
        return 403 "Access Denied: Direct dashboard access is disabled for security.";
    }
}
